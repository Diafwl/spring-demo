apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api.fullname" . }}
  labels:
    {{- include "api.labels" . | nindent 4 }}
data:
  LOGGING_LEVEL_ROOT: {{ .Values.config.logLevel | quote }}
  SERVER_PORT: "8080"
  DB_URL: {{ include "api.dbUrl" . | quote }}
  DB_USER: {{ .Values.database.user | quote }}
  DB_POOL_SIZE: {{ .Values.config.poolSize | quote }}
